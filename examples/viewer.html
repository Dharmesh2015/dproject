<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DProject Viewer — MSPDI XML</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: #1a1a2e;
    background: #f6f7fb;
    display: flex; flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #4361ee, #3730a3);
    color: white;
    padding: 16px 24px;
    display: flex; align-items: center; gap: 16px;
  }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  header .sub { opacity: 0.7; font-size: 12px; }
  header .ver { margin-left: auto; opacity: 0.5; font-size: 12px; font-family: ui-monospace, monospace; }

  #drop {
    flex: 1;
    margin: 24px;
    border: 2px dashed #cbd5e1;
    border-radius: 12px;
    background: white;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    gap: 12px;
    transition: border-color .2s, background .2s;
    cursor: pointer;
  }
  #drop.dragover { border-color: #4361ee; background: #eef2ff; }
  #drop .icon { font-size: 48px; opacity: 0.3; }
  #drop .hint { color: #64748b; font-size: 14px; }
  #drop input { display: none; }
  #drop button {
    background: #4361ee; color: white; border: none; padding: 8px 16px;
    border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
  }

  main { flex: 1; display: none; flex-direction: column; }
  main.visible { display: flex; }
  .meta-bar {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    padding: 14px 24px;
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  }
  .meta-bar .title { font-weight: 700; font-size: 16px; }
  .meta-bar .dim { color: #64748b; font-size: 12px; }
  .meta-bar .actions { margin-left: auto; display: flex; gap: 8px; }
  .meta-bar button {
    background: white; border: 1px solid #d1d5db; padding: 6px 12px;
    border-radius: 6px; font-size: 12px; cursor: pointer; color: #374151;
  }
  .meta-bar button:hover { background: #f9fafb; }
  .meta-bar button.primary { background: #4361ee; color: white; border-color: #4361ee; }

  .banner {
    padding: 10px 24px; font-size: 13px;
    border-bottom: 1px solid;
  }
  .banner.ok    { background: #d1fae5; border-color: #6ee7b7; color: #065f46; }
  .banner.warn  { background: #fef3c7; border-color: #fcd34d; color: #78350f; }
  .banner.error { background: #fee2e2; border-color: #fca5a5; color: #7f1d1d; }
  .banner b { font-weight: 700; }

  .tabs {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    padding: 0 24px;
    display: flex; gap: 4px;
  }
  .tabs button {
    background: none; border: none; padding: 12px 16px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    color: #64748b; border-bottom: 2px solid transparent;
  }
  .tabs button:hover { color: #1a1a2e; }
  .tabs button.active { color: #4361ee; border-bottom-color: #4361ee; }
  .tabs .count {
    display: inline-block; min-width: 18px; height: 18px; padding: 0 6px;
    margin-left: 4px; border-radius: 9px;
    background: #e5e7eb; color: #64748b;
    font-size: 11px; line-height: 18px; text-align: center; font-weight: 600;
  }

  .panels { flex: 1; overflow: auto; }
  .panel { display: none; padding: 16px 24px; }
  .panel.active { display: block; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  th { background: #f8f9fb; padding: 8px 12px; text-align: left; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #64748b; border-bottom: 1px solid #e5e7eb; white-space: nowrap; }
  td { padding: 8px 12px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
  tr:hover td { background: #f9fafb; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: ui-monospace, monospace; font-size: 12px; }
  td.dim { color: #94a3b8; font-size: 12px; }
  td .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .pill.summary { background: #eef2ff; color: #4338ca; }
  .pill.milestone { background: #fef3c7; color: #92400e; }
  .pill.task { background: #f1f5f9; color: #475569; }
  .pill.material { background: #fef3c7; color: #92400e; }
  .pill.work { background: #dbeafe; color: #1e40af; }
  .pill.fs { background: #dbeafe; color: #1e40af; }
  .pill.ff { background: #fce7f3; color: #9f1239; }
  .pill.ss { background: #d1fae5; color: #065f46; }
  .pill.sf { background: #fef3c7; color: #92400e; }
  .indent { display: inline-block; }
  .info { color: #64748b; font-size: 12px; padding: 12px 0; }
  pre { background: #1e293b; color: #f1f5f9; padding: 16px; border-radius: 6px; overflow: auto; font: 11px/1.5 ui-monospace, monospace; max-height: 400px; }

  .empty { color: #94a3b8; padding: 24px; text-align: center; font-style: italic; }
</style>
</head>
<body>

<header>
  <div>
    <h1>DProject Viewer</h1>
    <div class="sub">MS Project (MSPDI XML) — drag &amp; drop to inspect</div>
  </div>
  <div class="ver" id="ver">v?.?.?</div>
</header>

<div id="drop">
  <div class="icon">📂</div>
  <div><b>Drop an MSPDI .xml file here</b></div>
  <div class="hint">Or click to choose</div>
  <button type="button" id="pick">Choose File</button>
  <input type="file" id="file" accept=".xml,application/xml,text/xml">
  <div class="hint" style="margin-top:16px">Tries the 4 sample fixtures: <a href="#" id="sample-01">sample-01</a> · <a href="#" id="sample-3p">sample-3point</a> · <a href="#" id="sample-grp">sample-grouping</a> · <a href="#" id="sample-link">sample-linktypes</a></div>
</div>

<main id="main">

  <div class="meta-bar">
    <div>
      <div class="title" id="m-title">—</div>
      <div class="dim" id="m-sub">—</div>
    </div>
    <div class="actions">
      <button id="btn-roundtrip">Round-trip ↻</button>
      <button id="btn-rawxml">View XML</button>
      <button id="btn-rawjson">View JSON</button>
      <button class="primary" id="btn-new">Load another file</button>
    </div>
  </div>

  <div id="banner" class="banner ok"></div>

  <div class="tabs">
    <button data-tab="tasks"     class="active">Tasks <span class="count" id="c-tasks"></span></button>
    <button data-tab="resources">Resources <span class="count" id="c-res"></span></button>
    <button data-tab="assignments">Assignments <span class="count" id="c-asn"></span></button>
    <button data-tab="calendars">Calendars <span class="count" id="c-cal"></span></button>
    <button data-tab="baselines">Baselines <span class="count" id="c-base"></span></button>
    <button data-tab="extattr">Ext-Attrs <span class="count" id="c-ea"></span></button>
    <button data-tab="raw">Raw</button>
  </div>

  <div class="panels">
    <div class="panel active" id="panel-tasks"></div>
    <div class="panel" id="panel-resources"></div>
    <div class="panel" id="panel-assignments"></div>
    <div class="panel" id="panel-calendars"></div>
    <div class="panel" id="panel-baselines"></div>
    <div class="panel" id="panel-extattr"></div>
    <div class="panel" id="panel-raw"></div>
  </div>
</main>

<script>
'use strict';

let _project = null;
let _rawXml = '';

document.getElementById('ver').textContent = 'v' + (window.DProject ? DProject.version : 'unknown');

// ── File dispatch ─────────────────────────────────────────────────────────
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const pickBtn = document.getElementById('pick');

pickBtn.addEventListener('click', () => fileInput.click());
drop.addEventListener('click', e => { if (e.target === drop || e.target.classList.contains('icon') || e.target.classList.contains('hint')) fileInput.click(); });
fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });

drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('dragover'); });
drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
drop.addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('dragover');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = () => loadXmlString(String(reader.result), file.name);
  reader.onerror = () => alert('Failed to read file: ' + reader.error);
  reader.readAsText(file, 'utf-8');
}

// Sample fixture quick-loaders (relative paths — work via local server)
function fetchSample(name) {
  fetch('../tests/fixtures/' + name)
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(text => loadXmlString(text, name))
    .catch(err => alert('Could not load ' + name + ': ' + err.message + '\n\nTip: open this page via a local web server (e.g., python3 -m http.server) — file:// can\'t fetch siblings.'));
}
document.getElementById('sample-01').addEventListener('click',   e => { e.preventDefault(); fetchSample('sample-01.xml'); });
document.getElementById('sample-3p').addEventListener('click',   e => { e.preventDefault(); fetchSample('sample-3point.xml'); });
document.getElementById('sample-grp').addEventListener('click',  e => { e.preventDefault(); fetchSample('sample-grouping.xml'); });
document.getElementById('sample-link').addEventListener('click', e => { e.preventDefault(); fetchSample('sample-linktypes.xml'); });

// ── Parse + render ────────────────────────────────────────────────────────
function loadXmlString(xml, filename) {
  if (!window.DProject) {
    alert('DProject library not loaded. Make sure dist/dproject.min.js exists (run `npm run build` from dproject/).');
    return;
  }
  try {
    _rawXml = xml;
    _project = DProject.parse(xml);
  } catch (e) {
    alert('Parse failed: ' + e.message);
    return;
  }
  document.getElementById('drop').style.display = 'none';
  document.getElementById('main').classList.add('visible');
  document.getElementById('m-title').textContent = (_project.meta.title || _project.meta.name || filename || 'Untitled');
  document.getElementById('m-sub').textContent = (filename || '') + ' — ' + (_rawXml.length / 1024).toFixed(1) + ' KB';

  renderBanner();
  updateCounts();
  renderTasks();
  renderResources();
  renderAssignments();
  renderCalendars();
  renderBaselines();
  renderExtAttr();
  renderRaw();
}

function renderBanner() {
  const v = DProject.validate(_project);
  const b = document.getElementById('banner');
  if (v.ok) {
    b.className = 'banner ok';
    b.innerHTML = '<b>✓ Valid MSPDI</b> — passed all schema checks (no duplicate UIDs, no dangling refs, no cycles).';
  } else {
    b.className = 'banner warn';
    const items = v.errors.slice(0, 5).map(e => '<li>' + escape(e.code + ': ' + e.message) + '</li>').join('');
    const more = v.errors.length > 5 ? '<li>…and ' + (v.errors.length - 5) + ' more</li>' : '';
    b.innerHTML = '<b>⚠ Validation warnings (' + v.errors.length + ')</b><ul style="margin:6px 0 0 20px">' + items + more + '</ul>';
  }
}

function updateCounts() {
  document.getElementById('c-tasks').textContent = _project.tasks.length;
  document.getElementById('c-res').textContent   = _project.resources.length;
  document.getElementById('c-asn').textContent   = _project.assignments.length;
  document.getElementById('c-cal').textContent   = _project.calendars.length;
  let baseCount = 0;
  for (const t of _project.tasks) baseCount += (t.baselines || []).length;
  document.getElementById('c-base').textContent  = baseCount;
  let eaCount = _project.extendedAttributeDefs.length;
  for (const t of _project.tasks) eaCount += (t.extendedAttributes || []).length;
  document.getElementById('c-ea').textContent    = eaCount;
}

// ── Tabs ──────────────────────────────────────────────────────────────────
document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

// ── Renderers ─────────────────────────────────────────────────────────────
function renderTasks() {
  const root = document.getElementById('panel-tasks');
  if (!_project.tasks.length) { root.innerHTML = '<div class="empty">No tasks.</div>'; return; }
  const rows = _project.tasks.map(t => {
    const indent = '<span class="indent" style="width:' + ((t.outlineLevel || 0) * 14) + 'px"></span>';
    const typePill = '<span class="pill ' + t.type + (t.summary ? ' summary' : t.milestone ? ' milestone' : ' task') + '">' + (t.summary ? 'Σ' : t.milestone ? '◆' : '·') + '</span>';
    const depCount = (t.predecessors || []).length;
    const baseCount = (t.baselines || []).length;
    const eaCount = (t.extendedAttributes || []).length;
    return '<tr>'
      + '<td class="num">' + t.uid + '</td>'
      + '<td>' + indent + ' ' + typePill + ' ' + escape(t.name) + '</td>'
      + '<td class="dim">' + (t.start || '').substring(0, 10) + '</td>'
      + '<td class="dim">' + (t.finish || '').substring(0, 10) + '</td>'
      + '<td class="num">' + minToDays(t.duration) + 'd</td>'
      + '<td class="num">' + (t.percentComplete || 0) + '%</td>'
      + '<td class="num">' + (depCount || '') + '</td>'
      + '<td class="num">' + (baseCount || '') + '</td>'
      + '<td class="num">' + (eaCount || '') + '</td>'
      + '</tr>';
  }).join('');
  root.innerHTML = '<table><thead><tr><th>UID</th><th>Name</th><th>Start</th><th>Finish</th><th>Dur</th><th>%</th><th>Deps</th><th>Base</th><th>EA</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

function renderResources() {
  const root = document.getElementById('panel-resources');
  if (!_project.resources.length) { root.innerHTML = '<div class="empty">No resources.</div>'; return; }
  const rows = _project.resources.map(r => {
    const typePill = r.type === 1 ? '<span class="pill material">Material</span>' : '<span class="pill work">Work</span>';
    return '<tr>'
      + '<td class="num">' + r.uid + '</td>'
      + '<td>' + typePill + ' ' + escape(r.name) + '</td>'
      + '<td class="dim">' + escape(r.emailAddress || '') + '</td>'
      + '<td class="dim">' + escape(r.materialLabel || '') + '</td>'
      + '<td class="num">' + (r.standardRate || 0) + '</td>'
      + '<td class="num">' + (r.maxUnits || 0) + '</td>'
      + '<td class="num">' + (r.calendarUid || '') + '</td>'
      + '</tr>';
  }).join('');
  root.innerHTML = '<table><thead><tr><th>UID</th><th>Name</th><th>Email</th><th>Unit</th><th>Rate</th><th>Max</th><th>Cal</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

function renderAssignments() {
  const root = document.getElementById('panel-assignments');
  if (!_project.assignments.length) { root.innerHTML = '<div class="empty">No assignments.</div>'; return; }
  const rows = _project.assignments.map(a => '<tr>'
    + '<td class="num">' + a.uid + '</td>'
    + '<td class="num">' + a.taskUid + '</td>'
    + '<td class="num">' + a.resourceUid + '</td>'
    + '<td class="num">' + (a.units != null ? a.units.toFixed(2) : '') + '</td>'
    + '<td class="num">' + minToDays(a.work) + 'd</td>'
    + '<td class="num">' + (a.cost || 0) + '</td>'
    + '<td class="dim">' + (a.start || '').substring(0, 10) + '</td>'
    + '<td class="dim">' + (a.finish || '').substring(0, 10) + '</td>'
    + '</tr>').join('');
  root.innerHTML = '<table><thead><tr><th>UID</th><th>Task</th><th>Resource</th><th>Units</th><th>Work</th><th>Cost</th><th>Start</th><th>Finish</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

function renderCalendars() {
  const root = document.getElementById('panel-calendars');
  if (!_project.calendars.length) { root.innerHTML = '<div class="empty">No calendars.</div>'; return; }
  const html = _project.calendars.map(c => {
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const wd = (c.weekDays || []).map(w => days[w.dayType - 1] + (w.dayWorking ? '✓' : '✗')).join(' ');
    const exc = (c.exceptions || []).map(e =>
      '<tr><td>' + escape(e.name || '') + '</td><td class="dim">' + (e.startDate || '').substring(0,10) + '</td><td>' + (e.dayWorking ? 'Working' : 'Non-working') + '</td></tr>'
    ).join('');
    return '<div style="margin-bottom:24px"><h3 style="font-size:14px;margin-bottom:8px">' + escape(c.name || 'Unnamed') + ' <span style="color:#94a3b8;font-weight:400;font-size:12px">UID ' + c.uid + (c.isBaseCalendar ? ' · Base' : '') + '</span></h3>'
      + '<div style="font-family:ui-monospace,monospace;font-size:12px;color:#475569;margin-bottom:8px">' + wd + '</div>'
      + (exc ? '<table><thead><tr><th>Exception</th><th>Date</th><th>Type</th></tr></thead><tbody>' + exc + '</tbody></table>' : '<div class="info">No exceptions.</div>')
      + '</div>';
  }).join('');
  root.innerHTML = html;
}

function renderBaselines() {
  const root = document.getElementById('panel-baselines');
  const rows = [];
  for (const t of _project.tasks) {
    for (const b of (t.baselines || [])) {
      rows.push('<tr>'
        + '<td class="num">' + t.uid + '</td>'
        + '<td>' + escape(t.name) + '</td>'
        + '<td class="num">#' + b.number + '</td>'
        + '<td class="dim">' + (b.start || '').substring(0,10) + '</td>'
        + '<td class="dim">' + (b.finish || '').substring(0,10) + '</td>'
        + '<td class="num">' + minToDays(b.duration) + 'd</td>'
        + '<td class="num">' + (b.cost || 0) + '</td>'
        + '</tr>');
    }
  }
  if (!rows.length) { root.innerHTML = '<div class="empty">No baselines saved.</div>'; return; }
  root.innerHTML = '<table><thead><tr><th>Task UID</th><th>Name</th><th>Baseline</th><th>Start</th><th>Finish</th><th>Dur</th><th>Cost</th></tr></thead><tbody>' + rows.join('') + '</tbody></table>';
}

function renderExtAttr() {
  const root = document.getElementById('panel-extattr');
  let html = '';
  if (_project.extendedAttributeDefs.length) {
    const defs = _project.extendedAttributeDefs.map(d => '<tr>'
      + '<td>' + escape(d.fieldId) + '</td>'
      + '<td>' + escape(d.fieldName || '') + '</td>'
      + '<td><b>' + escape(d.alias || '') + '</b></td>'
      + '</tr>').join('');
    html += '<h3 style="font-size:14px;margin-bottom:8px">Definitions</h3><table><thead><tr><th>FieldID</th><th>Field Name</th><th>Alias</th></tr></thead><tbody>' + defs + '</tbody></table>';
  }
  const valRows = [];
  for (const t of _project.tasks) {
    for (const v of (t.extendedAttributes || [])) {
      valRows.push('<tr>'
        + '<td class="num">' + t.uid + '</td>'
        + '<td>' + escape(t.name) + '</td>'
        + '<td>' + escape(v.fieldId) + '</td>'
        + '<td>' + escape(v.value) + '</td>'
        + '</tr>');
    }
  }
  if (valRows.length) {
    html += '<h3 style="font-size:14px;margin:24px 0 8px">Per-task values</h3><table><thead><tr><th>Task UID</th><th>Name</th><th>FieldID</th><th>Value</th></tr></thead><tbody>' + valRows.join('') + '</tbody></table>';
  }
  if (!html) html = '<div class="empty">No ExtendedAttribute data.</div>';
  root.innerHTML = html;
}

function renderRaw() {
  document.getElementById('panel-raw').innerHTML = '<pre>' + escape(JSON.stringify(_project, null, 2)) + '</pre>';
}

// ── Actions ───────────────────────────────────────────────────────────────
document.getElementById('btn-new').addEventListener('click', () => {
  document.getElementById('main').classList.remove('visible');
  document.getElementById('drop').style.display = 'flex';
  fileInput.value = '';
});

document.getElementById('btn-roundtrip').addEventListener('click', () => {
  try {
    const xml2 = DProject.serialize(_project);
    const reparsed = DProject.parse(xml2);
    const t1 = _project.tasks.length, t2 = reparsed.tasks.length;
    const r1 = _project.resources.length, r2 = reparsed.resources.length;
    const c1 = _project.calendars.length, c2 = reparsed.calendars.length;
    const ok = t1 === t2 && r1 === r2 && c1 === c2;
    alert((ok ? '✓ Round-trip OK' : '✗ Round-trip mismatch') +
          '\nTasks:     ' + t1 + ' → ' + t2 +
          '\nResources: ' + r1 + ' → ' + r2 +
          '\nCalendars: ' + c1 + ' → ' + c2 +
          '\nXML size:  ' + (_rawXml.length / 1024).toFixed(1) + ' KB → ' + (xml2.length / 1024).toFixed(1) + ' KB');
  } catch (e) {
    alert('Round-trip failed: ' + e.message);
  }
});

document.getElementById('btn-rawxml').addEventListener('click', () => {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-raw').innerHTML = '<pre>' + escape(_rawXml) + '</pre>';
  document.getElementById('panel-raw').classList.add('active');
  document.querySelector('.tabs button[data-tab="raw"]').classList.add('active');
});

document.getElementById('btn-rawjson').addEventListener('click', () => {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  renderRaw();
  document.getElementById('panel-raw').classList.add('active');
  document.querySelector('.tabs button[data-tab="raw"]').classList.add('active');
});

// ── Helpers ───────────────────────────────────────────────────────────────
function minToDays(mins) {
  if (!mins) return 0;
  return Math.round(mins / 480 * 10) / 10;
}
function escape(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
</script>

</body>
</html>
